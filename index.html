<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Random Cats</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;background:#fafafa;color:#222}
  img{width:100%;max-height:60vh;object-fit:contain;background:#eee;border-radius:12px}
  button{font-size:1rem;padding:10px 16px;border:0;border-radius:8px;cursor:pointer;background:#222;color:#fff}
  button:disabled{opacity:.4;cursor:default}
  .row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center}
  .c{background:#fff;border-radius:8px;padding:8px 12px;margin:6px 0}
  .c small{color:#888} input,textarea{width:100%;box-sizing:border-box;padding:8px;margin:4px 0;font:inherit}
  a{color:#888;font-size:.8rem}
</style>
</head>
<body>
<h1>🐱 Random Cats</h1>
<img id="cat" alt="A random cat">
<div class="row">
  <button id="like">👍 <span id="nl">0</span></button>
  <button id="dislike">👎 <span id="nd">0</span></button>
  <button id="next" style="margin-left:auto">Next cat →</button>
</div>
<h3>Comments</h3>
<div id="comments"></div>
<input id="author" placeholder="Your name" maxlength="40">
<textarea id="body" placeholder="Say something about this cat…" maxlength="500" rows="2"></textarea>
<button id="send">Post comment</button>
<p><a href="admin.html">admin</a></p>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ---- CONFIG: paste your Supabase values (Project Settings -> API) ----
const SUPABASE_URL = "https://pllihkdrfnvriexwbdst.supabase.co";
const SUPABASE_KEY = "sb_publishable_qoQt9Ndae4oFy4TS8md1Iw_JMtY2BCH";
// ----------------------------------------------------------------------
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const voter = localStorage.voter || (localStorage.voter = crypto.randomUUID());
const voted = JSON.parse(localStorage.voted || "{}");
let catId = null;

const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function nextCat() {
  $("like").disabled = $("dislike").disabled = true;
  const j = await (await fetch("https://cataas.com/cat?json=true&t=" + Date.now())).json();
  catId = j.id || j._id;
  $("cat").src = "https://cataas.com/cat/" + catId;
  await refresh();
}

async function refresh() {
  const [{ data: votes }, { data: cs }] = await Promise.all([
    db.from("votes").select("value").eq("cat_id", catId),
    db.from("comments").select("author,body,created_at").eq("cat_id", catId).order("created_at")
  ]);
  $("nl").textContent = (votes || []).filter(v => v.value === 1).length;
  $("nd").textContent = (votes || []).filter(v => v.value === -1).length;
  $("like").disabled = $("dislike").disabled = !!voted[catId];
  $("comments").innerHTML = (cs || []).map(c =>
    `<div class="c"><small>${esc(c.author)} · ${new Date(c.created_at).toLocaleString()}</small><br>${esc(c.body)}</div>`
  ).join("") || "<small>No comments yet.</small>";
}

async function vote(value) {
  $("like").disabled = $("dislike").disabled = true;
  await db.from("votes").insert({ cat_id: catId, value, voter });
  voted[catId] = 1; localStorage.voted = JSON.stringify(voted);
  refresh();
}

$("like").onclick = () => vote(1);
$("dislike").onclick = () => vote(-1);
$("next").onclick = nextCat;
$("send").onclick = async () => {
  const author = $("author").value.trim(), body = $("body").value.trim();
  if (!author || !body) return;
  await db.from("comments").insert({ cat_id: catId, author, body });
  $("body").value = ""; refresh();
};
nextCat();
</script>
</body>
</html>
